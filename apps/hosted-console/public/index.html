<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>WGW Relay</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div><span class="mark">W</span><span>WGW Relay</span></div>
        <div id="connection" class="connection">Private team inbox</div>
      </header>
      <div id="notice" class="notice" role="status" hidden></div>

      <section id="auth" class="auth-grid" hidden>
        <div class="center-card compact">
          <p class="eyebrow">WELCOME BACK</p>
          <h1>Sign in</h1>
          <form id="login-form" class="stack">
            <label>Email<input name="email" type="email" autocomplete="email" required></label>
            <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
            <button type="submit">Open my inbox</button>
          </form>
        </div>
        <div class="center-card compact">
          <p class="eyebrow">NEW ORGANIZATION</p>
          <h1>Start your Relay</h1>
          <p>One business number. Your team receives only the conversations assigned to them.</p>
          <form id="register-form" class="stack">
            <label>Business name<input name="organizationName" placeholder="White Glove Wireless" maxlength="120" required></label>
            <label>Business texting number<input name="mainNumber" inputmode="tel" placeholder="+15551234567" required></label>
            <label>Your name<input name="name" autocomplete="name" maxlength="120" required></label>
            <label>Your email<input name="email" type="email" autocomplete="email" required></label>
            <label>Create a password<input name="password" type="password" minlength="12" autocomplete="new-password" required></label>
            <button type="submit">Create organization</button>
          </form>
          <details class="invite-details"><summary>Joining an existing team?</summary>
            <form id="invite-form" class="stack">
              <label>Invite code<input name="inviteCode" autocomplete="one-time-code" required></label>
              <label>Create a password<input name="password" type="password" minlength="12" autocomplete="new-password" required></label>
              <button type="submit">Join team</button>
            </form>
          </details>
        </div>
      </section>

      <section id="dashboard" hidden>
        <div class="hero">
          <div>
            <p class="eyebrow" id="viewer-role">YOUR RELAY</p>
            <h1 id="organization-name">Relay</h1>
            <p id="business-number" class="muted"></p>
          </div>
          <div class="hero-actions"><button class="secondary" id="refresh">Refresh</button><button class="secondary" id="logout">Sign out</button></div>
        </div>
        <nav class="tabs" aria-label="Relay sections">
          <button class="tab active" data-view="inbox">Inbox</button>
          <button class="tab" data-view="team">Team</button>
          <button class="tab" data-view="phone">Relay phone</button>
          <button class="tab" data-view="profile">My profile</button>
        </nav>
        <section id="view"></section>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
